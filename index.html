<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода | Красивые анимации</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff6b6b;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --bg-start: #1a1a2e;
            --bg-end: #16213e;
            --card-bg: rgba(255, 255, 255, 0.15);
            --text-color: #f8f9fa;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            --glass: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.2);
            --btn-gradient: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-start: #e0f7fa;
            --bg-end: #b2ebf2;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #1a1a2e;
            --input-bg: rgba(255, 255, 255, 0.9);
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Тема "Закат" */
        [data-theme="sunset"] {
            --primary: #ff9a9e;
            --secondary: #fad0c4;
            --bg-start: #ff9a9e;
            --bg-end: #fad0c4;
            --accent: #fbc2eb;
            --text-color: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.2);
        }

        /* Тема "Океан" */
        [data-theme="ocean"] {
            --primary: #0f2027;
            --secondary: #203a43;
            --bg-start: #0f2027;
            --bg-end: #203a43;
            --accent: #2c5364;
            --text-color: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            padding: 20px;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимации погоды */
        .weather-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        /* Облака */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            opacity: 0.9;
            animation: float 30s infinite linear;
            filter: blur(1px);
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
        }

        .cloud::before {
            width: 60%;
            height: 100%;
            top: -20%;
            left: 10%;
        }

        .cloud::after {
            width: 40%;
            height: 80%;
            top: -10%;
            right: 10%;
        }

        /* Дождь */
        .rain-drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.6), rgba(173, 216, 230, 0));
            border-radius: 0 0 5px 5px;
            animation: rain 1s infinite linear;
            filter: blur(0.5px);
        }

        /* Снег */
        .snowflake {
            position: absolute;
            color: white;
            font-size: 15px;
            animation: snow 4s infinite linear;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* Солнце */
        .sun {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255, 255, 0, 0.8) 0%, rgba(255, 200, 0, 0.4) 50%, transparent 70%);
            border-radius: 50%;
            animation: pulse 6s infinite alternate;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.5);
        }

        .sun::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(255, 255, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: sun-rays 8s infinite linear;
        }

        /* Лучи солнца */
        .sun-ray {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(255, 255, 0, 0.2) 5deg,
                transparent 10deg,
                rgba(255, 255, 0, 0.2) 15deg,
                transparent 20deg,
                rgba(255, 255, 0, 0.2) 25deg,
                transparent 30deg,
                rgba(255, 255, 0, 0.2) 35deg,
                transparent 40deg
            );
            border-radius: 50%;
            animation: rotate 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        @keyframes rain {
            0% { transform: translateY(-100px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes snow {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes sun-rays {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: var(--shadow);
            padding: 30px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            animation: fadeIn 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
        }

        .clock {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--text-color);
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            position: relative;
        }

        #city-input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        #city-input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        #city-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #search-btn {
            padding: 0 20px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .current-weather {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .city-name {
            font-size: 32px;
            font-weight: 600;
            margin: 10px 0;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .weather-main {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .weather-icon {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.3));
        }

        .temperature {
            font-size: 64px;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .description {
            font-size: 20px;
            margin: 10px 0;
            color: var(--text-color);
            opacity: 0.9;
            text-transform: capitalize;
        }

        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .detail {
            text-align: center;
            margin: 10px;
            min-width: 100px;
        }

        .detail-label {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .forecast-title {
            font-size: 24px;
            margin: 20px 0;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hourly-forecast {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .hourly-forecast::-webkit-scrollbar {
            height: 8px;
        }

        .hourly-forecast::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .hour-card {
            min-width: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        .hour-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .hour-time {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .hour-icon {
            width: 40px;
            height: 40px;
            margin: 5px auto;
        }

        .hour-temp {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .error {
            color: #ff6b6b;
            margin: 20px 0;
            font-size: 18px;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .suggestions {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            width: calc(100% - 40px);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: var(--shadow);
            color: var(--dark);
            margin-top: 55px;
            display: none;
            left: 0;
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--dark);
        }

        .suggestion-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Модальное окно настроек */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            color: var(--text-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.3s ease-out;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section-title {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .theme-options, .animation-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .theme-btn, .animation-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-color);
        }

        .theme-btn.active, .animation-btn.active {
            background: var(--btn-gradient);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-label {
            font-size: 16px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--btn-gradient);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Ползунки для интенсивности */
        .intensity-slider {
            width: 100%;
            margin: 10px 0;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .slider-label {
            min-width: 100px;
            font-size: 14px;
        }

        .slider-value {
            min-width: 40px;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--btn-gradient);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .weather-main {
                flex-direction: column;
            }

            .hour-card {
                min-width: 100px;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .slider-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="weather-animation" id="weather-animation"></div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-sun-rain"></i> Погодное приложение</h1>
            <button class="settings-btn" id="settings-btn"><i class="fas fa-cog"></i></button>
        </div>

        <div class="clock" id="clock">⏳ Загрузка времени...</div>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Введите город..." autocomplete="off">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="current-weather" id="current-weather">
            <div class="loading" id="loading"></div>
        </div>

        <div class="forecast-title"><i class="fas fa-clock"></i> Прогноз по часам</div>
        <div class="hourly-forecast" id="hourly-forecast">
            <!-- Карточки прогноза по часам будут здесь -->
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Настройки</div>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">Тема</div>
                <div class="toggle-container">
                    <span class="toggle-label">Светлая</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">Темная</span>
                </div>
                <div class="theme-options">
                    <button class="theme-btn" data-theme="default">Стандартная</button>
                    <button class="theme-btn" data-theme="sunset">Закат</button>
                    <button class="theme-btn" data-theme="ocean">Океан</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">Интенсивность анимаций</div>
                <div class="slider-container">
                    <span class="slider-label">Облака</span>
                    <input type="range" class="intensity-slider" id="cloud-intensity" min="0" max="10" value="5">
                    <span class="slider-value" id="cloud-value">5</span>
                </div>
                <div class="slider-container">
                    <span class="slider-label">Дождь</span>
                    <input type="range" class="intensity-slider" id="rain-intensity" min="0" max="10" value="5">
                    <span class="slider-value" id="rain-value">5</span>
                </div>
                <div class="slider-container">
                    <span class="slider-label">Снег</span>
                    <input type="range" class="intensity-slider" id="snow-intensity" min="0" max="10" value="5">
                    <span class="slider-value" id="snow-value">5</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Настройки приложения
        const apiKey = "9948c1b823285668bcdce9ebb40f7018";
        const currentWeather = document.getElementById("current-weather");
        const hourlyForecast = document.getElementById("hourly-forecast");
        const cityInput = document.getElementById("city-input");
        const searchBtn = document.getElementById("search-btn");
        const suggestions = document.getElementById("suggestions");
        const loading = document.getElementById("loading");
        const clock = document.getElementById("clock");
        const weatherAnimation = document.getElementById("weather-animation");
        const settingsBtn = document.getElementById("settings-btn");
        const settingsModal = document.getElementById("settings-modal");
        const closeModal = document.getElementById("close-modal");
        const themeToggle = document.getElementById("theme-toggle");
        const themeButtons = document.querySelectorAll(".theme-btn");

        // Ползунки интенсивности
        const cloudIntensity = document.getElementById("cloud-intensity");
        const rainIntensity = document.getElementById("rain-intensity");
        const snowIntensity = document.getElementById("snow-intensity");
        const cloudValue = document.getElementById("cloud-value");
        const rainValue = document.getElementById("rain-value");
        const snowValue = document.getElementById("snow-value");

        // Текущие настройки
        let currentTheme = localStorage.getItem("theme") || "dark";
        let isDarkMode = currentTheme === "dark" || currentTheme === "ocean";
        let currentTimezone = 0;
        let currentWeatherCondition = "";

        // Настройки интенсивности (загружаем из localStorage или используем значения по умолчанию)
        let animationSettings = {
            clouds: parseInt(localStorage.getItem("cloud-intensity")) || 5,
            rain: parseInt(localStorage.getItem("rain-intensity")) || 5,
            snow: parseInt(localStorage.getItem("snow-intensity")) || 5
        };

        // Устанавливаем значения ползунков
        cloudIntensity.value = animationSettings.clouds;
        rainIntensity.value = animationSettings.rain;
        snowIntensity.value = animationSettings.snow;
        cloudValue.textContent = animationSettings.clouds;
        rainValue.textContent = animationSettings.rain;
        snowValue.textContent = animationSettings.snow;

        // Устанавливаем тему при загрузке
        document.documentElement.setAttribute("data-theme", currentTheme);
        themeToggle.checked = isDarkMode;

        // Устанавливаем активный класс для кнопок тем
        themeButtons.forEach(btn => {
            btn.classList.remove("active");
            if (btn.dataset.theme === currentTheme) {
                btn.classList.add("active");
            }
        });

        // Функция для транслитерации
        function transliterate(text) {
            const translitMap = {
                'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'yo',
                'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm',
                'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
                'ф': 'f', 'х': 'kh', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'shch',
                'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya',
                ' ': '-'
            };
            return text.toLowerCase().split('').map(char => translitMap[char] || char).join('');
        }

        // Функция для отображения времени в часовом поясе города
        function updateClock(timezoneOffset) {
            const now = new Date();
            const localTime = new Date(now.getTime() + (timezoneOffset * 1000));

            const hours = String(localTime.getUTCHours()).padStart(2, '0');
            const minutes = String(localTime.getUTCMinutes()).padStart(2, '0');
            const seconds = String(localTime.getUTCSeconds()).padStart(2, '0');

            clock.textContent = `🕒 ${hours}:${minutes}:${seconds}`;
        }

        // Обновляем время каждую секунду
        let clockInterval;
        function startClock(timezoneOffset) {
            if (clockInterval) clearInterval(clockInterval);
            updateClock(timezoneOffset);
            clockInterval = setInterval(() => updateClock(timezoneOffset), 1000);
        }

        // Функция для отображения загрузки
        function showLoading() {
            currentWeather.innerHTML = '<div class="loading"></div>';
            hourlyForecast.innerHTML = '';
        }

        // Функция для отображения текущей погоды
        function displayCurrentWeather(data) {
            const { name } = data;
            const { temp, feels_like, humidity, pressure } = data.main;
            const { description, icon } = data.weather[0];
            const { speed, deg } = data.wind;
            const { sunrise, sunset } = data.sys;
            const timezone = data.timezone || 0;

            // Сохраняем часовой пояс для часов
            currentTimezone = timezone;

            const sunriseTime = new Date((sunrise + timezone) * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const sunsetTime = new Date((sunset + timezone) * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const windDirection = getWindDirection(deg);

            currentWeather.innerHTML = `
                <div class="city-name">${name}</div>
                <div class="weather-main">
                    <img class="weather-icon" src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${description}">
                    <div class="temperature">${Math.round(temp)}°C</div>
                </div>
                <div class="description">${description}</div>
                <div class="details">
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-thermometer-half"></i> Ощущается</div>
                        <div class="detail-value">${Math.round(feels_like)}°C</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-tint"></i> Влажность</div>
                        <div class="detail-value">${humidity}%</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-wind"></i> Ветер</div>
                        <div class="detail-value">${speed} м/с<br><small>${windDirection}</small></div>
                    </div>
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-gauge-high"></i> Давление</div>
                        <div class="detail-value">${Math.round(pressure * 0.75)} мм</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-sun"></i> Восход</div>
                        <div class="detail-value">${sunriseTime}</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label"><i class="fas fa-moon"></i> Закат</div>
                        <div class="detail-value">${sunsetTime}</div>
                    </div>
                </div>
            `;

            // Обновляем анимацию погоды
            currentWeatherCondition = description;
            updateWeatherAnimation(description);
        }

        // Функция для обновления анимации погоды
        function updateWeatherAnimation(weatherCondition) {
            weatherAnimation.innerHTML = '';

            if (weatherCondition.includes("дождь") || weatherCondition.includes("rain")) {
                createRain(animationSettings.rain);
            } else if (weatherCondition.includes("снег") || weatherCondition.includes("snow")) {
                createSnow(animationSettings.snow);
            } else if (weatherCondition.includes("облачн") || weatherCondition.includes("cloud")) {
                createClouds(animationSettings.clouds);
            } else if (weatherCondition.includes("ясно") || weatherCondition.includes("clear")) {
                createSun();
            } else if (weatherCondition.includes("ветер") || weatherCondition.includes("wind")) {
                createClouds(animationSettings.clouds);
                createWindEffect(animationSettings.clouds / 2);
            }
        }

        // Функция для создания облаков
        function createClouds(intensity) {
            const count = Math.floor(intensity * 2);
            for (let i = 0; i < count; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const size = Math.random() * 60 + 40;
                cloud.style.width = `${size}px`;
                cloud.style.height = `${size / 2}px`;
                cloud.style.top = `${Math.random() * 60 + 10}vh`;
                cloud.style.left = `${Math.random() * 100}vw`;
                cloud.style.animationDuration = `${Math.random() * 20 + 20}s`;
                cloud.style.animationDelay = `${Math.random() * 10}s`;
                cloud.style.opacity = Math.random() * 0.3 + 0.5;
                weatherAnimation.appendChild(cloud);
            }
        }

        // Функция для создания дождя
        function createRain(intensity) {
            const count = Math.floor(intensity * 4);
            for (let i = 0; i < count; i++) {
                const drop = document.createElement('div');
                drop.className = 'rain-drop';
                drop.style.left = `${Math.random() * 100}vw`;
                drop.style.top = `${Math.random() * -100}px`;
                drop.style.animationDuration = `${Math.random() * 0.5 + 0.3}s`;
                drop.style.animationDelay = `${Math.random() * 2}s`;
                drop.style.height = `${Math.random() * 15 + 10}px`;
                drop.style.opacity = Math.random() * 0.5 + 0.3;
                weatherAnimation.appendChild(drop);
            }
        }

        // Функция для создания снега
        function createSnow(intensity) {
            const count = Math.floor(intensity * 3);
            for (let i = 0; i < count; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
                flake.style.left = `${Math.random() * 100}vw`;
                flake.style.top = `${Math.random() * -100}px`;
                flake.style.animationDuration = `${Math.random() * 3 + 2}s`;
                flake.style.animationDelay = `${Math.random() * 3}s`;
                flake.style.fontSize = `${Math.random() * 12 + 8}px`;
                flake.style.opacity = Math.random() * 0.5 + 0.5;
                weatherAnimation.appendChild(flake);
            }
        }

        // Функция для создания солнца
        function createSun() {
            const sunContainer = document.createElement('div');
            sunContainer.style.position = 'absolute';
            sunContainer.style.top = '20vh';
            sunContainer.style.left = 'calc(50vw - 30px)';

            const sun = document.createElement('div');
            sun.className = 'sun';
            sunContainer.appendChild(sun);

            const rays = document.createElement('div');
            rays.className = 'sun-ray';
            sun.appendChild(rays);

            weatherAnimation.appendChild(sunContainer);
        }

        // Функция для создания эффекта ветра
        function createWindEffect(intensity) {
            const count = Math.floor(intensity);
            for (let i = 0; i < count; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const size = Math.random() * 40 + 20;
                cloud.style.width = `${size}px`;
                cloud.style.height = `${size / 2}px`;
                cloud.style.top = `${Math.random() * 40 + 20}vh`;
                cloud.style.left = `${Math.random() * 100}vw`;
                cloud.style.animationDuration = `${Math.random() * 10 + 5}s`;
                cloud.style.animationDelay = `${Math.random() * 2}s`;
                cloud.style.opacity = Math.random() * 0.4 + 0.3;
                cloud.style.filter = 'blur(2px)';
                weatherAnimation.appendChild(cloud);
            }
        }

        // Функция для отображения прогноза по часам
        function displayHourlyForecast(hourlyData, timezoneOffset) {
            hourlyForecast.innerHTML = '';

            // Получаем текущую дату в часовом поясе города
            const now = new Date();
            const localTime = new Date(now.getTime() + (timezoneOffset * 1000));
            const today = localTime.getDate();

            // Фильтруем данные по текущему дню
            const todayForecast = hourlyData.filter(item => {
                const date = new Date(item.dt * 1000 + (timezoneOffset * 1000));
                return date.getDate() === today;
            });

            // Сортируем по времени
            todayForecast.sort((a, b) => a.dt - b.dt);

            // Отображаем прогноз
            todayForecast.forEach(item => {
                const date = new Date(item.dt * 1000 + (timezoneOffset * 1000));
                const hour = date.getHours();
                const temp = Math.round(item.main.temp);
                const icon = item.weather[0].icon;
                const description = item.weather[0].description;

                const hourCard = document.createElement('div');
                hourCard.className = 'hour-card';
                hourCard.innerHTML = `
                    <div class="hour-time">${hour}:00</div>
                    <img class="hour-icon" src="https://openweathermap.org/img/wn/${icon}.png" alt="${description}">
                    <div class="hour-temp">${temp}°C</div>
                `;
                hourlyForecast.appendChild(hourCard);
            });
        }

        // Функция для определения направления ветра
        function getWindDirection(deg) {
            const directions = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
            const index = Math.round(deg / 45) % 8;
            return directions[index];
        }

        // Функция для отображения ошибки
        function showError(message) {
            currentWeather.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${message}</div>`;
            hourlyForecast.innerHTML = '';
        }

        // Функция для поиска городов
        async function searchCities(query) {
            if (!query.trim()) {
                suggestions.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${apiKey}`
                );
                const data = await response.json();
                displaySuggestions(data);
            } catch (error) {
                console.error("Ошибка при поиске городов:", error);
            }
        }

        // Функция для отображения подсказок
        function displaySuggestions(cities) {
            if (cities.length === 0) {
                suggestions.style.display = 'none';
                return;
            }

            suggestions.innerHTML = '';
            cities.forEach(city => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.textContent = `${city.name}, ${city.country}`;
                item.addEventListener('click', () => {
                    cityInput.value = city.name;
                    suggestions.style.display = 'none';
                    getWeather(city.name, city.lat, city.lon);
                });
                suggestions.appendChild(item);
            });
            suggestions.style.display = 'block';
        }

        // Функция для получения погоды и прогноза
        async function getWeather(city, lat = null, lon = null) {
            showLoading();

            try {
                let currentData, forecastData, timezoneOffset = 0;

                // Если переданы координаты, используем их
                if (lat && lon) {
                    const currentResponse = await fetch(
                        `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ru`
                    );
                    currentData = await currentResponse.json();

                    if (currentResponse.ok) {
                        timezoneOffset = currentData.timezone || 0;

                        const forecastResponse = await fetch(
                            `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ru`
                        );
                        forecastData = await forecastResponse.json();
                    } else {
                        showError("Не удалось получить погоду для этого города.");
                        return;
                    }
                } else {
                    // Проверяем, есть ли город в словаре координат
                    const normalizedCity = city.toLowerCase().trim();
                    if (cityCoordinates[normalizedCity]) {
                        const { lat: cityLat, lon: cityLon } = cityCoordinates[normalizedCity];
                        await getWeather(city, cityLat, cityLon);
                        return;
                    }

                    // Пробуем запрос по названию города
                    const currentResponse = await fetch(
                        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ru`
                    );
                    currentData = await currentResponse.json();

                    if (currentResponse.ok) {
                        timezoneOffset = currentData.timezone || 0;

                        const forecastResponse = await fetch(
                            `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric&lang=ru`
                        );
                        forecastData = await forecastResponse.json();
                    } else {
                        showError("Город не найден. Попробуйте другой.");
                        return;
                    }
                }

                // Отображаем текущую погоду
                displayCurrentWeather(currentData);

                // Отображаем прогноз по часам
                if (forecastData && forecastData.list) {
                    displayHourlyForecast(forecastData.list, timezoneOffset);
                }

            } catch (error) {
                showError("Произошла ошибка. Попробуйте позже.");
                console.error(error);
            }
        }

        // Словари для известных городов
        const cityCoordinates = {
            "ишим": { lat: 56.1167, lon: 69.5, name: "Ишим" },
            "москва": { lat: 55.7558, lon: 37.6173, name: "Москва" },
            "санкт-петербург": { lat: 59.9343, lon: 30.3351, name: "Санкт-Петербург" },
            "екaтеринбург": { lat: 56.8519, lon: 60.6122, name: "Екатеринбург" },
            "новосибирск": { lat: 55.0084, lon: 82.9357, name: "Новосибирск" },
            "казань": { lat: 55.7955, lon: 49.1064, name: "Казань" },
            "нижний новгород": { lat: 56.3269, lon: 44.0075, name: "Нижний Новгород" },
            "челябинск": { lat: 55.1644, lon: 61.4368, name: "Челябинск" },
            "омск": { lat: 54.9924, lon: 73.3686, name: "Омск" },
            "самара": { lat: 53.2000, lon: 50.1500, name: "Самара" },
            "ростов-на-дону": { lat: 47.2225, lon: 39.7206, name: "Ростов-на-Дону" },
            "уфа": { lat: 54.7351, lon: 55.9587, name: "Уфа" },
            "красноярск": { lat: 56.0184, lon: 92.8672, name: "Красноярск" },
            "воронеж": { lat: 51.6608, lon: 39.2003, name: "Воронеж" },
            "пермь": { lat: 58.0105, lon: 56.2294, name: "Пермь" },
            "волгоград": { lat: 48.7080, lon: 44.5133, name: "Волгоград" },
        };

        // Обработчики событий для поиска
        searchBtn.addEventListener("click", () => {
            const city = cityInput.value.trim();
            if (city) {
                getWeather(city);
                suggestions.style.display = 'none';
            } else {
                showError("Пожалуйста, введите название города.");
            }
        });

        cityInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const city = cityInput.value.trim();
                if (city) {
                    getWeather(city);
                    suggestions.style.display = 'none';
                } else {
                    showError("Пожалуйста, введите название города.");
                }
            }
        });

        cityInput.addEventListener("input", () => {
            const query = cityInput.value.trim();
            if (query.length > 2) {
                searchCities(query);
            } else {
                suggestions.style.display = 'none';
            }
        });

        // Скрываем подсказки при клике вне поля ввода
        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-box")) {
                suggestions.style.display = 'none';
            }
        });

        // Обработчики для модального окна настроек
        settingsBtn.addEventListener("click", () => {
            settingsModal.style.display = "flex";
        });

        closeModal.addEventListener("click", () => {
            settingsModal.style.display = "none";
        });

        // Закрытие модального окна при клике вне его
        settingsModal.addEventListener("click", (e) => {
            if (e.target === settingsModal) {
                settingsModal.style.display = "none";
            }
        });

        // Переключение темы (темная/светлая)
        themeToggle.addEventListener("change", () => {
            isDarkMode = themeToggle.checked;
            if (isDarkMode) {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
            }
            updateThemeButtons();
        });

        // Выбор темы
        themeButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                themeButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentTheme = btn.dataset.theme;
                document.documentElement.setAttribute("data-theme", currentTheme);
                localStorage.setItem("theme", currentTheme);
                isDarkMode = currentTheme === "dark" || currentTheme === "ocean";
                themeToggle.checked = isDarkMode;
            });
        });

        // Функция для обновления активных кнопок тем
        function updateThemeButtons() {
            themeButtons.forEach(btn => {
                btn.classList.remove("active");
                if (btn.dataset.theme === currentTheme) {
                    btn.classList.add("active");
                }
            });
        }

        // Обработчики для ползунков интенсивности
        cloudIntensity.addEventListener("input", () => {
            animationSettings.clouds = parseInt(cloudIntensity.value);
            cloudValue.textContent = animationSettings.clouds;
            localStorage.setItem("cloud-intensity", animationSettings.clouds);
            updateWeatherAnimation(currentWeatherCondition);
        });

        rainIntensity.addEventListener("input", () => {
            animationSettings.rain = parseInt(rainIntensity.value);
            rainValue.textContent = animationSettings.rain;
            localStorage.setItem("rain-intensity", animationSettings.rain);
            updateWeatherAnimation(currentWeatherCondition);
        });

        snowIntensity.addEventListener("input", () => {
            animationSettings.snow = parseInt(snowIntensity.value);
            snowValue.textContent = animationSettings.snow;
            localStorage.setItem("snow-intensity", animationSettings.snow);
            updateWeatherAnimation(currentWeatherCondition);
        });

        // Автоматически загружаем погоду для Ишима при открытии страницы
        window.addEventListener("load", () => {
            getWeather("Ишим");
        });
    </script>
</body>
</html>
